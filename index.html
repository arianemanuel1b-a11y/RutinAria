<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Onori">
<meta name="theme-color" content="#141312">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Bitácora Onori</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: una columna de planilla de gimnasio. Barra superior fija (reloj + eficiencia),
   tarjetas por ejercicio con filas de serie, panel de descanso anclado abajo.
   Color por categoría = disco olímpico (rojo 25 · azul 20 · amarillo 15). */
:root{
  --bg:#efede9; --surface:#fbfaf8; --sunk:#e5e2dd; --ink:#1c1b19; --muted:#69645d; --line:#d6d1ca;
  --red:#c63328; --blue:#2356a8; --yellow:#b88700; --green:#2c7a4b;
  --accent:var(--red); --on-accent:#fff;
  --f-display:'Big Shoulders Display','Arial Narrow','Helvetica Neue',sans-serif;
  --f-body:'Barlow',-apple-system,'Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141312; --surface:#1d1c1a; --sunk:#262421; --ink:#f0ebe4; --muted:#a39b91; --line:#35322e;
  --red:#ec5547; --blue:#6b9cec; --yellow:#e7b632; --green:#4fbf7e; --on-accent:#140f0e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141312; --surface:#1d1c1a; --sunk:#262421; --ink:#f0ebe4; --muted:#a39b91; --line:#35322e;
  --red:#ec5547; --blue:#6b9cec; --yellow:#e7b632; --green:#4fbf7e; --on-accent:#140f0e; color-scheme:dark}
/* Carcasa fija de pantalla completa: solo #app se desplaza; las pestañas quedan pegadas abajo. */
html{box-sizing:border-box;background:var(--bg);overscroll-behavior:none}
body{position:fixed;inset:0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
/* iOS 26 (WebKit 301108): en apps instaladas con barra translúcida la ventana queda más corta que la pantalla
   mientras el documento sea más bajo que ella. Un documento de al menos una pantalla le devuelve el alto completo. */
@media (display-mode: standalone){html{min-height:min(100lvh,calc(100% + env(safe-area-inset-top,0px)))}}
#app{flex:1 1 auto;min-height:0;width:100%;box-sizing:border-box;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,.set,.stepper,.rirs,.lights{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(32px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display);font-weight:900;letter-spacing:.01em;line-height:.95;text-transform:uppercase}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* barra superior */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:8px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line)}
.brand{font-size:30px}
.brand small{display:block;font-family:var(--f-body);font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);margin-top:4px}
.badge{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:20px;flex:none}
.clock{font-size:26px}
.effbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.effbar i{display:block;height:100%;background:var(--green);transition:width .4s}
.eff-warn .effbar i{background:var(--yellow)} .eff-bad .effbar i{background:var(--red)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r);font-weight:700;background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* tarjetas */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.plate{width:28px;height:28px;border-radius:50%;flex:none;border:5px solid var(--pc);box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 9px var(--pc)}
.plate.red{--pc:var(--red)} .plate.blue{--pc:var(--blue)} .plate.yellow{--pc:var(--yellow)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ex.complete{opacity:.72}
.ex-head{padding:14px 14px 10px;display:flex;gap:12px;align-items:flex-start}
.ex-name{font-size:18px;font-weight:700;line-height:1.2}
.ex-meta{font-size:14px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);white-space:nowrap}
.chip.up,.chip.force{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.chip.down{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.chip.hold{color:var(--muted)}
.chip.ss{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.target{padding:0 14px 10px;font-size:14px}
.target b{font-family:var(--f-mono);font-weight:600}
.warm{padding:0 14px 10px;font-size:13px;color:var(--muted)}
.sets{border-top:1px solid var(--line)}
.set{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:0 14px;border-bottom:1px solid var(--line);text-align:left}
.set:last-child{border-bottom:0}
.set .idx{width:26px;font-family:var(--f-mono);color:var(--muted);font-size:14px}
.set .val{flex:1;font-family:var(--f-mono);font-size:17px;font-variant-numeric:tabular-nums}
.set .st{font-size:13px;font-weight:600}
.set.ready{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.set.ready .val{color:var(--accent);font-family:var(--f-body);font-weight:700;font-size:16px}
.set.locked{color:var(--muted)}
.set.done .tick{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:var(--on-accent);font-size:14px;font-weight:800}
.set .miss{color:var(--red)} .set .over{color:var(--green)}
.ss-ex{border-top:1px solid var(--line);padding-top:10px}
.ss-ex>.row{padding:0 14px 8px}
.ss-tag{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue);font-family:var(--f-mono);font-weight:600;font-size:14px}
.ss-series{border-bottom:1px solid var(--line);padding-bottom:4px}
.ss-series:last-child{border-bottom:0}
.ss-series.cur{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.ss-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 2px}
.ss-series .set{border-bottom:0;min-height:52px;background:transparent}
.ss-in{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.ss-in input{width:70px;height:44px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);text-align:center;font-family:var(--f-mono);font-size:18px;font-weight:600}
.ss-in input[data-f="r"]{width:52px}
.ss-ok{margin-left:auto;width:48px;height:44px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:20px;font-weight:800;flex:none}
.note{margin:0 14px 12px;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:14px}
.note.low{background:color-mix(in srgb,var(--red) 11%,var(--surface))}
.note.high{background:color-mix(in srgb,var(--green) 13%,var(--surface))}

/* panel de descanso */
.rest{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.rest-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.rest .big{font-family:var(--f-display);font-weight:900;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}
.rest .rbar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--bg) 22%,transparent);overflow:hidden}
.rest .rbar i{display:block;height:100%;background:var(--accent)}
.rest .btn{background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg)}
.rest .btn.primary{background:var(--accent);color:var(--on-accent)}
.rest.over{background:var(--green);color:#fff}
.rest.over .btn{background:rgba(255,255,255,.18);color:#fff}
.rest .sg{font-size:14px;opacity:.9}
.flash{animation:fl .5s 3}
@keyframes fl{50%{filter:brightness(1.5)}}

/* hoja inferior */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--surface);border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center}
.stepper button{height:64px;border-radius:12px;background:var(--sunk);font-size:28px;font-weight:700}
.stepper input{width:100%;height:64px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-align:center;font-family:var(--f-mono);font-size:30px;font-weight:600}
.rirs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rirs button{height:52px;border-radius:10px;background:var(--sunk);font-family:var(--f-mono);font-size:20px;font-weight:600}
.rirs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.lights{display:flex;gap:6px}
.lights button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--sunk);font-size:13px;font-weight:700}
.lights .v[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.lights .a[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:#1c1b19}
.lights .r[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.joints{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.joints button{padding:6px 10px;border-radius:99px;background:var(--sunk);font-size:13px}
.joints button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* tabs */
.tabs{position:relative;flex:none;z-index:15;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{flex:1;max-width:200px;height:56px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}

/* volumen */
.vol{display:grid;grid-template-columns:86px 1fr 66px;gap:6px 10px;align-items:center;font-size:14px}
.vbar{position:relative;height:12px;background:var(--sunk);border-radius:3px}
.vbar i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:3px}
.vbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent)}
.hist-item{width:100%;text-align:left;display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.prog-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* documento técnico */
.day-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.day-row b{display:block;font-weight:700;font-size:16px}
.day-row small{display:block;color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile .v{font-family:var(--f-display);font-weight:900;font-size:38px;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .v small{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.tile .d{font-size:13px;margin-top:6px;color:var(--muted)}
.d-up{color:var(--green);font-weight:600} .d-dn{color:var(--red);font-weight:600}
.cap{font-size:13px;color:var(--muted);min-height:18px;font-family:var(--f-mono)}
.chart svg{display:block;width:100%;height:auto}
.chart-empty{padding:14px 0 4px;color:var(--muted);font-size:14px}
.sbar{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.sbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app" class="wrap"></div>
<nav class="tabs" id="tabs">
  <button data-act="tab" data-v="home" id="tab-home">Entrenar</button>
  <button data-act="tab" data-v="stats" id="tab-stats">Indicadores</button>
  <button data-act="tab" data-v="history" id="tab-history">Progreso</button>
</nav>
<div id="rest"></div>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* =====================================================================
   BITÁCORA ONORI — Motor lógico (funciones puras, sin DOM)
   Rutina: Recomposición corporal · Método H. Onori · 4 días Torso/Piernas
   ===================================================================== */

/* Categorías. k = peso del fallo en el algoritmo de eficiencia.
   Color = disco olímpico: rojo 25 kg, azul 20 kg, amarillo 15 kg. */
const CAT = {
  b: { k: 3, label: 'Básico pesado', short: 'Básico', plate: 'red' },
  s: { k: 2, label: 'Semipesado', short: 'Semi', plate: 'blue' },
  a: { k: 1, label: 'Aislamiento', short: 'Aisl.', plate: 'yellow' },
};

const MUSCLES = {
  pecho: 'Pecho', espalda: 'Espalda', hombros: 'Hombros', biceps: 'Bíceps',
  triceps: 'Tríceps', cuad: 'Cuádriceps', isquios: 'Isquios', gluteos: 'Glúteos', gemelos: 'Gemelos',
};

/* X(id, nombre, series, repsMin, repsMax, descanso s, categoría, incremento kg, opciones)
   per: el peso se registra por mancuerna · uni: unilateral (c/p) · g: superserie
   mus: músculos (1 = directo, 0.5 = indirecto) · alt: variante en máquina */
function X(id, name, sets, rmin, rmax, rest, cat, inc, o = {}) {
  return { id, name, sets, rmin, rmax, rest, cat, inc, per: false, uni: false, g: null, note: '', mus: {}, alt: '', ...o };
}

/* Versión de rutina: una sesión activa de otra versión no se retoma. */
const ROUTINE = 'onori-brazos-2026-10';

const DAYS = [
  { n: 1, title: 'Torso', focus: 'Pecho, espalda y hombro', ex: [
    X('d1_pbarra', 'Press plano con barra', 3, 6, 8, 180, 'b', 2.5, { mus: { pecho: 1, triceps: .5, hombros: .5 }, alt: 'Press de pecho en máquina' }),
    X('d1_jalon', 'Jalón al pecho (polea alta)', 3, 8, 10, 180, 'b', 2.5, { mus: { espalda: 1, biceps: .5 }, alt: 'Jalón en máquina convergente' }),
    X('d1_militar', 'Press militar sentado con mancuernas', 3, 8, 10, 180, 'b', 2, { per: true, mus: { hombros: 1, triceps: .5 }, alt: 'Press de hombros en máquina' }),
    X('d1_gironda', 'Remo en polea baja (Gironda)', 2, 10, 12, 120, 's', 2.5, { note: 'Semipesado, bilateral.', mus: { espalda: 1, biceps: .5 }, alt: 'Remo en máquina con pecho apoyado' }),
    X('d1_cruce', 'Cruce de poleas', 2, 12, 15, 90, 'a', 2.5, { note: 'Excéntrica lenta.', mus: { pecho: 1 }, alt: 'Aperturas en máquina (peck deck)' }),
  ]},
  { n: 2, title: 'Piernas + bíceps', focus: 'Piernas corto + bíceps pesado', ex: [
    X('d2_sent', 'Sentadilla (hack o libre)', 3, 6, 8, 180, 'b', 5, { mus: { cuad: 1, gluteos: .5 }, alt: 'Sentadilla péndulo' }),
    X('d2_sillon', 'Sillón de cuádriceps', 3, 12, 15, 90, 'a', 5, { note: 'Pausa de 1 s arriba.', mus: { cuad: 1 }, alt: 'Sillón unilateral, rango controlado' }),
    X('d2_isquios', 'Curl de isquios (acostado o sentado)', 3, 8, 10, 120, 'b', 5, { note: 'Pesado: reemplaza el estímulo posterior.', mus: { isquios: 1 }, alt: 'Curl de isquios sentado' }),
    X('d2_curlbi', 'Curl de bíceps (mancuernas o barra)', 3, 6, 8, 150, 'b', 2, { note: 'Básico pesado de brazos. Registrá siempre con el mismo criterio (barra total o kg por mancuerna).', mus: { biceps: 1 }, alt: 'Curl de bíceps en máquina' }),
    X('d2_martillo', 'Curl martillo con mancuernas', 2, 10, 12, 90, 'a', 2, { per: true, note: 'Foco en braquial y antebrazo.', mus: { biceps: 1 }, alt: 'Curl martillo en polea con cuerda' }),
  ]},
  { n: 3, title: 'Torso', focus: 'Espalda, pecho y tríceps pesado', ex: [
    X('d3_remo', 'Remo con barra (bilateral)', 3, 6, 8, 180, 'b', 2.5, { mus: { espalda: 1, biceps: .5 }, alt: 'Remo en máquina con pecho apoyado' }),
    X('d3_incl', 'Press inclinado con mancuernas', 3, 6, 8, 180, 'b', 2, { per: true, mus: { pecho: 1, triceps: .5, hombros: .5 }, alt: 'Press inclinado en máquina' }),
    X('d3_lat', 'Elevaciones laterales (polea)', 3, 10, 12, 90, 'a', 2.5, { note: 'Aislamiento al fallo.', mus: { hombros: 1 }, alt: 'Vuelos laterales en máquina' }),
    X('d3_frances', 'Press francés o copa a 2 manos', 3, 8, 10, 150, 'b', 2, { note: 'Básico pesado de brazos.', mus: { triceps: 1 }, alt: 'Extensión de tríceps en máquina' }),
    X('d3_soga', 'Tríceps en polea (soga)', 2, 12, 15, 90, 'a', 2.5, { note: 'Apertura de la soga al final.', mus: { triceps: 1 }, alt: 'Extensión de tríceps en máquina' }),
  ]},

  <div class="top"><div class="row between"><div class="disp brand">Bitácora Onori<small>Prioridad brazos · 4 días · al fallo real</small></div>${storageBadge()}</div></div>
  <div class="stack" style="margin-top:14px">
    ${act ? `<button class="panel row" data-act="resume" style="text-align:left;border-color:var(--accent)">
        <div class="grow"><div class="eyebrow" style="color:var(--accent)">Sesión en curso</div><div style="font-weight:700;font-size:18px">Día ${act.day} · ${DAY(act.day).title} — ${DAY(act.day).focus}</div>
        <div class="muted num" style="font-size:14px">${Object.values(act.sets).reduce((a, s) => a + s.length, 0)} series · empezó ${new Date(act.startedAt).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })}</div></div>
        <span class="btn primary sm">Retomar</span></button>` : ''}
    <div class="panel stack">
      <div><div class="eyebrow">${S.profile.lastDay ? 'Te toca hoy' : 'Primera sesión'} · Día ${nd}</div>
      <h1 class="disp" style="font-size:48px;margin-top:4px">${dd.title}</h1>
      <div class="muted" style="font-weight:600">${dd.focus}</div></div>
      <div>${dd.ex.map(ex => { const p = S.profile.prog[ex.id] || {}; return `
        <div class="row" style="padding:7px 0;border-top:1px solid var(--line);font-size:15px">
          <span class="plate ${CAT[ex.cat].plate}" style="width:16px;height:16px;border-width:3px;box-shadow:none"></span>
          <span class="grow">${esc(exName(ex))}</span>
          <span class="num muted" style="font-size:14px">${ex.sets}×${ex.rmin}–${ex.rmax}</span>
          <span class="num" style="min-width:64px;text-align:right;font-weight:600">${p.w != null ? kg(p.w) + ' kg' : '—'}</span>
        </div>`; }).join('')}</div>
      ${act ? '' : `<button class="btn primary block" data-act="start" data-n="${nd}">Empezar Día ${nd}</button>`}
    </div>
    ${act ? '' : `<div class="stack" style="gap:8px"><div class="eyebrow">Otro día</div>${others.map(d => `<button class="day-row" data-act="start" data-n="${d.n}"><span class="num muted" style="font-size:13px;width:44px">Día ${d.n}</span><span class="grow"><b>${d.title}</b><small>${d.focus}</small></span><span class="muted" style="font-size:22px">›</span></button>`).join('')}</div>`}
  </div>`;
}

/* ---------- Sesión ---------- */
function viewSession() {
  const a = A(); const d = DAY(a.day);
  if (a.phase === 'finish') return viewFinish();
  return `
  <div class="top" id="topbar">
    <div class="row">
      <button class="iconbtn" data-act="home" aria-label="Volver al inicio">‹</button>
      <div class="grow"><div class="eyebrow">Día ${d.n}</div><div class="disp" style="font-size:24px">${d.title}</div></div>
      <div style="text-align:right"><div class="clock num" id="clock">0:00</div><div class="muted" style="font-size:12px" id="wake"></div></div>
    </div>
    <div id="effwrap" style="margin-top:8px"></div>
  </div>
  <div class="stack" style="margin-top:14px">
    ${(() => { const seen = new Set(); return d.ex.map(ex => {
      if (!ex.g) return exCard(d, ex);
      if (seen.has(ex.g)) return '';
      seen.add(ex.g); const pair = d.ex.filter(e => e.g === ex.g);
      return groupCard(d, pair[0], pair[1]); }).join(''); })()}
    <div class="stack" style="margin-top:6px">
      <button class="btn primary block" data-act="finish">Terminar sesión</button>
      <button class="btn ghost block" data-act="discard">Descartar sesión</button>
    </div>
  </div>`;
}

/* Bloques por ejercicio: carga objetivo, aproximación, notas y autorregulación (siempre por ejercicio). */
function exTarget(ex) {
  const l = logged(ex.id), p = S.profile.prog[ex.id] || {};
  const wTarget = S.active.nextW[ex.id] != null ? S.active.nextW[ex.id] : (l.length ? l[0].w : p.w);
  const wu = warmup(ex, p.w);
  return `${wTarget != null && wTarget !== '' ? `<div class="target">Carga: <b>${kg(wTarget)} ${unit(ex)}</b>${p.status && p.status !== 'new' && !l.length ? ` · <span class="chip ${p.status}">${STATUS[p.status]}</span> <span class="muted">${esc(p.reason || '')}</span>` : ''}${p.target && !l.length ? ` · objetivo <b>${p.target}</b> reps` : ''}</div>` : `<div class="target muted">Primera vez: elegí una carga que llegue al fallo dentro de ${ex.rmin}–${ex.rmax} reps.</div>`}
    ${wu.length && !l.length ? `<div class="warm">Aproximación: ${wu.map(x => `<span class="num">${x.reps}×${kg(x.w)}</span>`).join(' · ')}</div>` : ''}
    ${ex.note ? `<div class="warm">${esc(ex.note)}</div>` : ''}`;
}
function exNote(ex) {
  const l = logged(ex.id), last = l[l.length - 1];
  if (l.length >= ex.sets) {
    const pr = nextPrescription(ex, l, S.profile.prog[ex.id]);
    return `<div class="note ${pr.status === 'up' || pr.status === 'force' ? 'high' : pr.status === 'down' ? 'low' : ''}">Próxima sesión: <b class="num">${kg(pr.w)}</b> ${unit(ex)} · <span class="chip ${pr.status}">${STATUS[pr.status]}</span> ${esc(pr.reason)}</div>`;
  }
  const sg = last ? suggestAfterSet(ex, last) : null;
  if (sg && sg.type === 'low') return `<div class="note low">Serie ${l.length}: ${last.r} reps, ${sg.deficit} bajo el mínimo. ${sg.primary === 'rest' ? `Recomendado: <b>+45 s</b> de descanso. Alternativa: bajar a <b class="num">${kg(sg.wDown)}</b> ${unit(ex)}.` : `Recomendado: bajar a <b class="num">${kg(sg.wDown)}</b> ${unit(ex)} (−${Math.round(sg.pct * 100)} %). Alternativa: +45 s.`}</div>`;
  if (sg && sg.type === 'high') return `<div class="note high">Serie ${l.length}: ${last.r} reps, sobre el rango. Subí a <b class="num">${kg(sg.wUp)}</b> ${unit(ex)} en la próxima.</div>`;
  return '';
}
function exCard(d, ex) {
  const finished = logged(ex.id).length >= ex.sets;
  return `
  <article class="ex ${finished ? 'complete' : ''}" id="ex-${ex.id}">
    <div class="ex-head">
      <span class="plate ${CAT[ex.cat].plate}" title="${CAT[ex.cat].label}"></span>
      <div class="grow">
        <div class="ex-name">${esc(exName(ex))}${S.profile.swaps[ex.id] ? ' <span class="chip">variante</span>' : ''}</div>
        <div class="ex-meta"><span class="num">${ex.sets}${ex.uni ? ' c/p' : ''} × ${ex.rmin}–${ex.rmax}</span> · descanso <span class="num">${mmss(ex.rest)}</span> · ${CAT[ex.cat].label}</div>
      </div>
    </div>
    ${exTarget(ex)}
    ${exNote(ex)}
    <div class="sets">${Array.from({ length: ex.sets }, (_, i) => setRow(ex, i)).join('')}</div>
  </article>`;
}

/* Superserie: una tarjeta, dos entidades independientes (A y B). Cada "Serie n" agrupa A_n y B_n. */
function groupCard(d, a, b) {
  const la = logged(a.id).length, lb = logged(b.id).length;
  const finished = la >= a.sets && lb >= b.sets;
  const n = Math.max(a.sets, b.sets);
  const sub = (ex, tag) => `<div class="ss-ex"><div class="row" style="align-items:flex-start"><span class="ss-tag">${tag}</span><div class="grow">
      <div class="ex-name" style="font-size:16px">${esc(exName(ex))}${S.profile.swaps[ex.id] ? ' <span class="chip">variante</span>' : ''}</div>
      <div class="ex-meta"><span class="num">${ex.sets} × ${ex.rmin}–${ex.rmax}</span> · ${CAT[ex.cat].label}</div></div></div>
    ${exTarget(ex)}${exNote(ex)}</div>`;
  const series = Array.from({ length: n }, (_, i) => {
    const dA = la > i, dB = lb > i;
    const label = dA && dB ? '✓ completa' : dA ? 'falta B · sin descanso' : dB ? 'falta A · sin descanso' : '';
    const cur = !(dA && dB) && Math.min(la, lb) === i;
    return `<div class="ss-series ${cur ? 'cur' : ''}"><div class="ss-h"><span class="eyebrow">Serie ${i + 1}</span><span class="muted" style="font-size:12px">${label}</span></div>
      ${i < a.sets ? ssRow(a, i, 'A') : ''}${i < b.sets ? ssRow(b, i, 'B') : ''}</div>`;
  }).join('');
  return `
  <article class="ex ${finished ? 'complete' : ''}" id="ex-${a.id}">
    <div class="ex-head">
      <span class="plate ${CAT[a.cat].plate}" title="${CAT[a.cat].label}"></span>
      <div class="grow"><div class="eyebrow" style="color:var(--blue)">Superserie</div>
        <div class="ex-meta">A y B sin pausa · descanso de <span class="num">${mmss(Math.max(a.rest, b.rest))}</span> recién al completar ambos</div></div>
    </div>
    ${sub(a, 'A')}${sub(b, 'B')}
    <div class="sets">${series}</div>
  </article>`;
}
function ssRow(ex, i, tag) {
  const st = setState(ex, i);
  if (st === 'done') {
    const s = logged(ex.id)[i];
    const cls = s.r < ex.rmin ? 'miss' : s.r > ex.rmax ? 'over' : '';
    return `<button class="set done" data-act="edit" data-ex="${ex.id}" data-i="${i}"><span class="ss-tag">${tag}</span>
      <span class="val">${kg(s.w)} <span class="muted" style="font-size:13px">${unit(ex)}</span> × <span class="${cls}">${s.r}</span>${s.rir != null ? ` <span class="muted" style="font-size:13px">RIR ${s.rir}</span>` : ''}</span><span class="tick">✓</span></button>`;
  }
  if (st === 'ready') {
    const k = ex.id + ':' + i;
    const dr = S.draft[k] || (S.draft[k] = prefill(ex, i));
    return `<div class="set"><span class="ss-tag">${tag}</span>
      <label class="ss-in"><input id="dw-${ex.id}-${i}" data-draft="${k}" data-f="w" inputmode="decimal" autocomplete="off" value="${dr.w === '' ? '' : String(dr.w).replace('.', ',')}" placeholder="kg" aria-label="Carga ${tag}, serie ${i + 1}"><span>kg</span></label>
      <label class="ss-in"><input id="dr-${ex.id}-${i}" data-draft="${k}" data-f="r" inputmode="numeric" autocomplete="off" value="${dr.r}" aria-label="Repeticiones ${tag}, serie ${i + 1}"><span>reps</span></label>
      <button class="ss-ok" data-act="ssdone" data-ex="${ex.id}" data-i="${i}" aria-label="Completar ${tag}, serie ${i + 1}">✓</button></div>`;
  }
  const txt = st === 'rest' ? 'Bloqueada: descanso en curso' : st === 'pair' ? 'Cerrá primero la serie anterior' : 'Pendiente';
  return `<div class="set locked"><span class="ss-tag">${tag}</span><span class="val" style="font-family:var(--f-body);font-size:15px">${txt}</span><span class="st">${st === 'rest' ? '🔒' : ''}</span></div>`;
}

function setRow(ex, i) {
  const st = setState(ex, i);
  if (st === 'done') {
    const s = logged(ex.id)[i];
    const cls = s.r < ex.rmin ? 'miss' : s.r > ex.rmax ? 'over' : '';
    return `<button class="set done" data-act="edit" data-ex="${ex.id}" data-i="${i}">
      <span class="idx">${i + 1}</span><span class="val">${kg(s.w)} <span class="muted" style="font-size:13px">${unit(ex)}</span> × <span class="${cls}">${s.r}</span>${s.rir != null ? ` <span class="muted" style="font-size:13px">RIR ${s.rir}</span>` : ''}</span><span class="tick">✓</span></button>`;
  }
  if (st === 'ready') return `<button class="set ready" data-act="log" data-ex="${ex.id}" data-i="${i}"><span class="idx">${i + 1}</span><span class="val">Registrar serie ${i + 1}</span><span class="st">›</span></button>`;
  return `<div class="set locked"><span class="idx">${i + 1}</span><span class="val" style="font-family:var(--f-body);font-size:15px">${st === 'rest' ? 'Bloqueada: descanso en curso' : st === 'pair' ? 'Cerrá primero la serie anterior' : 'Pendiente'}</span><span class="st">${st === 'rest' ? '🔒' : ''}</span></div>`;
}

function effHTML(final) {
  const a = A(); const d = DAY(a.day);
  const e = efficiency(d, a.sets, final).value;
  const pj = projectDuration(d, a.sets, a.startedAt, Date.now());
  const cls = e >= 95 ? '' : e >= 85 ? 'eff-warn' : 'eff-bad';
  return `<div class="${cls}"><div class="row between" style="font-size:13px;margin-bottom:4px"><span><span class="eyebrow">Eficiencia</span> <b class="num" style="font-size:15px">${nf.format(Math.round(e * 10) / 10)} %</b></span>
    <span class="muted num" id="proj">${pj.done}/${pj.planned} series · fin ≈ ${Math.round(pj.projected / 60)} min${pj.projected > 3600 ? ' ⚠︎' : ''}</span></div><div class="effbar"><i style="width:${e}%"></i></div></div>`;
}
function paintTop() {
  if (S.view !== 'session' || !S.active) return;
  const w = $('#effwrap'); if (w && S.active.phase === 'train') w.innerHTML = effHTML(false);
  const wk = $('#wake'); if (wk) wk.textContent = wake ? 'pantalla activa' : '';
  tickText();
}

/* ---------- Cierre: semáforo ---------- */
function viewFinish() {
  const a = A(); const d = DAY(a.day);
  const e = efficiency(d, a.sets, true).value;
  const done = d.ex.filter(ex => logged(ex.id).length);
  const missing = d.ex.reduce((s, ex) => s + Math.max(0, ex.sets - logged(ex.id).length), 0);
  const tonnage = d.ex.reduce((s, ex) => s + logged(ex.id).reduce((t, x) => t + x.w * x.r * (ex.per ? 2 : 1), 0), 0);
  return `
  <div class="top"><div class="row"><button class="iconbtn" data-act="backtrain" aria-label="Volver a la sesión">‹</button>
    <div class="grow"><div class="eyebrow">Cierre · Día ${d.n}</div><div class="disp" style="font-size:26px">Molestias articulares</div></div></div></div>
  <div class="stack" style="margin-top:14px">
    <div class="panel row" style="gap:18px;flex-wrap:wrap">
      <div><div class="eyebrow">Eficiencia</div><div class="disp num" style="font-size:44px">${nf.format(Math.round(e * 10) / 10)}%</div></div>
      <div><div class="eyebrow">Duración</div><div class="disp num" style="font-size:44px">${Math.round((Date.now() - a.startedAt) / 60000)}′</div></div>
      <div><div class="eyebrow">Tonelaje</div><div class="disp num" style="font-size:44px">${nf.format(Math.round(tonnage))}</div></div>
      ${missing ? `<div class="muted" style="font-size:14px;flex-basis:100%">${missing} serie${missing > 1 ? 's' : ''} sin registrar: cuentan como fallo completo.</div>` : ''}
    </div>
    <p class="muted" style="margin:0;font-size:15px">Marcá cada ejercicio. Verde: sin molestia. Amarillo: molestia leve. Rojo: dolor articular. Dos rojos en las últimas 3 sesiones sugieren cambiar a una variante en máquina.</p>
    ${done.map(ex => { const f = a.fatigue[ex.id] || { c: 'v', j: [] }; return `
      <div class="panel">
        <div class="row"><span class="plate ${CAT[ex.cat].plate}" style="width:20px;height:20px;border-width:4px;box-shadow:none"></span><div class="grow" style="font-weight:600">${esc(exName(ex))}</div>
        <div class="lights" role="group" aria-label="Molestia">${['v', 'a', 'r'].map(c => `<button class="${c}" data-act="light" data-ex="${ex.id}" data-c="${c}" aria-pressed="${f.c === c}" aria-label="${{ v: 'Verde', a: 'Amarillo', r: 'Rojo' }[c]}">${{ v: 'V', a: 'A', r: 'R' }[c]}</button>`).join('')}</div></div>
        ${f.c !== 'v' ? `<div class="joints">${JOINTS.map(j => `<button data-act="joint" data-ex="${ex.id}" data-j="${j}" aria-pressed="${f.j.includes(j)}">${j}</button>`).join('')}</div>` : ''}
      </div>`; }).join('')}
    <button class="btn primary block" data-act="save">Guardar sesión</button>
  </div>`;
}

/* ---------- Resultado ---------- */
function viewResult() {
  const r = S.result;
  return `
  <div class="top"><div class="disp brand">Sesión guardada<small>Día ${r.day} · ${r.minutes} min · eficiencia ${nf.format(r.efficiency)} %</small></div></div>
  <div class="stack" style="margin-top:14px">
    ${r.swaps.map(s => `<div class="panel stack" style="border-color:var(--red)">
      <div><div class="eyebrow" style="color:var(--red)">Fatiga articular</div><div style="font-weight:700">${esc(s.name)}: 2 alertas rojas en las últimas 3 sesiones.</div>
      <div class="muted" style="font-size:15px">Sugerencia: cambiar a <b>${esc(s.alt)}</b>. La carga se reinicia porque no se transfiere entre equipos.</div></div>
      <button class="btn primary" data-act="swap" data-ex="${s.id}">Cambiar a la variante</button></div>`).join('')}
    ${r.watch.length ? `<div class="panel"><div class="eyebrow">Vigilar</div><div style="font-size:15px">${r.watch.map(esc).join(' · ')}</div></div>` : ''}
    ${r.prs.length ? `<div class="panel"><div class="eyebrow" style="color:var(--green)">Récords estimados</div>${r.prs.map(p => `<div class="row between" style="font-size:15px"><span>${esc(p.name)}</span><span class="num">e1RM ${kg(p.e)} kg</span></div>`).join('')}</div>` : ''}
    <div class="panel"><div class="eyebrow">Prescripción para la próxima vez</div>
      ${r.next.map(n => `<div class="prog-row"><div style="min-width:0"><div style="font-weight:600">${esc(n.name)}</div><div class="muted" style="font-size:13px">${esc(n.reason)}</div></div>
        <span class="chip ${n.status}">${STATUS[n.status]}</span><span class="num" style="font-weight:600">${kg(n.w)}</span></div>`).join('')}</div>
    <button class="btn block" data-act="home">Listo</button>
  </div>`;
}

/* ---------- Indicadores ---------- */
const CW = 320;
const niceMax = v => { const p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; };
const dfmt = d => new Date(d).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' });
function delta(x, unit = ' %', digits = 1) {
  if (x == null || !Number.isFinite(x)) return '<span>sin comparación</span>';
  const v = Math.round(x * 10 ** digits) / 10 ** digits;
  if (v === 0) return `<span>= sin cambios</span>`;
  return v > 0 ? `<span class="d-up">▲ +${nf.format(v)}${unit}</span>` : `<span class="d-dn">▼ −${nf.format(-v)}${unit}</span>`;
}
function tile(label, value, unit, sub) {
  return `<div class="tile"><div class="eyebrow">${label}</div><div class="v">${value}${unit ? `<small>${unit}</small>` : ''}</div><div class="d">${sub}</div></div>`;
}
const barPath = (x, y, w, h) => { const r = Math.min(4, h, w / 2); return h <= 0 ? '' : `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };

/* Barras: una serie, base en cero, objetivo opcional (línea punteada). Tocar una barra muestra su valor. */
function barChart(id, vals, labels, tips, opt = {}) {
  const H = 132, top = 14, bot = 20, ph = H - top - bot, n = vals.length;
  const mx = niceMax(Math.max(...vals, opt.target || 0, opt.min || 1));
  const slot = CW / n, bw = Math.min(24, slot * .6), y = v => top + ph * (1 - v / mx);
  let g = `<line x1="0" x2="${CW}" y1="${y(mx)}" y2="${y(mx)}" stroke="var(--line)" stroke-dasharray="2 3"/>
    <text x="0" y="${y(mx) - 4}" font-size="10" fill="var(--muted)">${opt.fmt ? opt.fmt(mx) : nf.format(mx)}</text>
    <line x1="0" x2="${CW}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  if (opt.target) g += `<line x1="0" x2="${CW}" y1="${y(opt.target)}" y2="${y(opt.target)}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${CW}" y="${y(opt.target) - 4}" font-size="10" text-anchor="end" fill="var(--muted)">${opt.targetLabel || ''}</text>`;
  vals.forEach((v, i) => {
    const x = slot * i + (slot - bw) / 2, h = y(0) - y(v);
    g += `<path d="${barPath(x, y(v), bw, h)}" fill="${i === n - 1 ? 'var(--accent)' : opt.color || 'var(--ink)'}" opacity="${i === n - 1 ? 1 : .78}"/>`;
    g += `<text x="${slot * i + slot / 2}" y="${H - 5}" font-size="10" text-anchor="middle" fill="var(--muted)">${labels[i]}</text>`;
    g += `<rect x="${slot * i}" y="0" width="${slot}" height="${H}" fill="transparent" data-act="tip" data-chart="${id}" data-tip="${esc(tips[i])}"/>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${CW} ${H}" role="img" aria-label="${esc(opt.aria || '')}">${g}</svg></div>`;
}
/* Línea: una serie, eje sin forzar cero (índices y porcentajes), referencia opcional. */
function lineChart(id, vals, labels, tips, opt = {}) {
  const H = 140, top = 16, bot = 20, left = 30, ph = H - top - bot, n = vals.length;
  let lo = Math.min(...vals, opt.ref ?? Infinity), hi = Math.max(...vals, opt.ref ?? -Infinity);
  if (hi - lo < 4) { lo -= 2; hi += 2; }
  const padv = (hi - lo) * .12; lo -= padv; hi += padv;
  const x = i => n === 1 ? left + (CW - left) / 2 : left + 6 + (CW - left - 18) * i / (n - 1);
  const y = v => top + ph * (1 - (v - lo) / (hi - lo));
  let g = '';
  [hi - padv, (hi + lo) / 2, lo + padv].forEach(t => {
    g += `<line x1="${left}" x2="${CW}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${left - 6}" y="${y(t) + 3}" font-size="10" text-anchor="end" fill="var(--muted)">${Math.round(t)}</text>`;
  });
  if (opt.ref != null) g += `<line x1="${left}" x2="${CW}" y1="${y(opt.ref)}" y2="${y(opt.ref)}" stroke="var(--muted)" stroke-width="1"/>`;
  g += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ')}"/>`;
  vals.forEach((v, i) => { if (n <= 16 || i === n - 1) g += `<circle cx="${x(i)}" cy="${y(v)}" r="${i === n - 1 ? 5 : 4}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`; });
  g += `<text x="${x(n - 1)}" y="${y(vals[n - 1]) - 10}" font-size="11" font-weight="600" text-anchor="${n === 1 ? 'middle' : 'end'}" fill="var(--ink)">${opt.fmt ? opt.fmt(vals[n - 1]) : Math.round(vals[n - 1])}</text>`;
  g += `<text x="${x(0)}" y="${H - 5}" font-size="10" text-anchor="start" fill="var(--muted)">${labels[0]}</text>`;
  if (n > 1) g += `<text x="${x(n - 1)}" y="${H - 5}" font-size="10" text-anchor="end" fill="var(--muted)">${labels[n - 1]}</text>`;
  const sw = n === 1 ? CW : (CW - left) / (n - 1);
  vals.forEach((v, i) => { g += `<rect x="${n === 1 ? 0 : x(i) - sw / 2}" y="0" width="${sw}" height="${H}" fill="transparent" data-act="tip" data-chart="${id}" data-tip="${esc(tips[i])}"/>`; });
  return `<div class="chart"><svg viewBox="0 0 ${CW} ${H}" role="img" aria-label="${esc(opt.aria || '')}">${g}</svg></div>`;
}
function chartPanel(id, title, sub, body, cap) {

}

function viewStats() {
  const ss = S.sessions, now = Date.now(), D30 = now - 30 * DAY_MS;

  const ch = chrono(ss);

      ${tile('Tonelaje 7 días', nf.format(Math.round(tw)), 'kg', `${delta(pct(tw, lw))} vs 7 días previos`)}

      ${tile('Duración', mins == null ? '—' : Math.round(mins), 'min', mins == null ? '' : mins > 60 ? '<span class="d-dn">▲ sobre los 60 min</span>' : mins < 45 ? 'bajo los 45 min' : 'dentro de 45–60 ✓')}
    </div>

    <div class="panel stack" style="gap:10px"><div><div class="eyebrow">Prioridad brazos</div><div class="muted" style="font-size:13px">Cambio de fuerza estimada desde tu primer registro</div></div>
      <div class="big2">
        <div><div class="muted" style="font-size:13px;font-weight:600">Bíceps</div><div class="disp num" style="font-size:40px">${armFmt(armV(bi))}<small style="font-size:16px"> %</small></div></div>
        <div><div class="muted" style="font-size:13px;font-weight:600">Tríceps</div><div class="disp num" style="font-size:40px">${armFmt(armV(tr))}<small style="font-size:16px"> %</small></div></div>

      si.length >= 2 ? lineChart('si', si.map(p => p.v), si.map(p => dfmt(p.t)), si.map(p => `${dfmt(p.t)} · índice ${nf.format(Math.round(p.v * 10) / 10)}`), { ref: 100, aria: 'Índice de fuerza por sesión', fmt: v => nf.format(Math.round(v)) }) : '<div class="chart-empty">Aparece desde tu segunda sesión.</div>',

      <div style="font-size:15px;border-top:1px solid var(--line);padding-top:10px"><b class="num">${q.lastSets ? Math.round(q.nearFail / q.lastSets * 100) : 0} %</b> de tus últimas series terminaron al fallo o a 1 rep <span class="muted">(RIR ≤ 1). El método pide RIR 0.</span></div>` : '<div class="chart-empty">Sin series en los últimos 30 días.</div>'}

function progRow(p) {

/* ---------- Progreso ---------- */
function spark(id) {
  const pts = S.sessions.slice().reverse().map(s => (s.exercises || []).find(e => e.id === id)).map(e => e ? bestE1(e) : 0).filter(v => v > 0);
  if (pts.length < 2) return '<span class="muted" style="font-size:12px">—</span>';
  const W = 72, H = 24, lo = Math.min(...pts), hi = Math.max(...pts), sp = hi - lo || 1;
  const xy = pts.map((v, i) => [i / (pts.length - 1) * (W - 4) + 2, H - 3 - (v - lo) / sp * (H - 6)]);
  const [lx, ly] = xy[xy.length - 1];
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="Tendencia de 1RM estimado"><polyline fill="none" stroke="var(--muted)" stroke-width="1.5" points="${xy.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}"/><circle cx="${lx}" cy="${ly}" r="2.5" fill="var(--accent)"/></svg>`;
}

/* ---------------- Panel de descanso (anclado abajo) ---------------- */
function renderRest() {

  if (S.view !== 'session' || !r || S.active.phase !== 'train') { restEl.innerHTML = ''; restEl.className = ''; app.style.paddingBottom = ''; return; }
  app.style.paddingBottom = '300px';
  const ex = EX[r.exId]; const ap = r.applied || {};
  const sgHTML = (r.suggs || []).map(sg => {
    const sx = EX[sg.exId], who = esc(exName(sx));
    if (sg.type === 'low') return `<div class="sg">${who}: ${sg.deficit} rep${sg.deficit > 1 ? 's' : ''} bajo el mínimo.</div>
      <div class="row" style="flex-wrap:wrap;gap:8px">
        <button class="btn sm ${sg.primary === 'rest' ? 'primary' : ''}" data-act="add45" ${r.applied45 ? 'disabled' : ''}>${r.applied45 ? '+45 s aplicado' : '+45 s descanso'}</button>
        <button class="btn sm ${sg.primary === 'load' ? 'primary' : ''}" data-act="applyw" data-ex="${sx.id}" data-w="${sg.wDown}" ${ap[sx.id] === sg.wDown ? 'disabled' : ''}>${ap[sx.id] === sg.wDown ? 'Carga ajustada' : `Bajar a ${kg(sg.wDown)} ${unit(sx)}`}</button></div>`;
    return `<div class="sg">${who}: sobre el rango.</div><div class="row"><button class="btn sm primary" data-act="applyw" data-ex="${sx.id}" data-w="${sg.wUp}" ${ap[sx.id] === sg.wUp ? 'disabled' : ''}>${ap[sx.id] === sg.wUp ? 'Carga ajustada' : `Subir a ${kg(sg.wUp)} ${unit(sx)}`}</button></div>`;
  }).join('');
  const what = r.group ? 'Superserie A + B' : exName(ex);
  restEl.className = 'rest' + (r.done ? ' over' : '');
  restEl.innerHTML = `<div class="rest-in">
    <div class="row between"><div><div class="eyebrow" style="color:inherit;opacity:.7" id="rest-label">${r.done ? 'Descanso cumplido' : 'Descanso'}</div><div class="big" id="rest-time">${mmss((r.endsAt - Date.now()) / 1000)}</div></div>
      <div style="text-align:right;font-size:14px;max-width:48%">${r.done ? 'Serie siguiente desbloqueada' : 'Próxima serie bloqueada'}<br><span style="opacity:.75">${esc(what)}</span></div></div>
    ${r.done ? '' : `<div class="rbar"><i id="rest-bar" style="width:0%"></i></div>`}
    ${r.done ? '' : sgHTML}
    <div class="row" style="gap:8px">${r.done ? `<button class="btn primary sm grow" data-act="dismiss">Seguir</button>` : `
      <button class="btn sm" data-act="restadj" data-d="-15">−15 s</button><button class="btn sm" data-act="restadj" data-d="15">+15 s</button><button class="btn sm grow" data-act="skip">Saltar descanso</button>`}</div></div>`;
  tickText();
}

/* Reloj: nunca cuenta, siempre compara con el reloj del sistema. */
function tickText() {
  const a = S.active; if (!a || S.view !== 'session') return;
  const c = $('#clock'); if (c) c.textContent = mmss((Date.now() - a.startedAt) / 1000);
  const r = a.rest; if (!r) return;
  const left = (r.endsAt - Date.now()) / 1000;
  const t = $('#rest-time'); if (t) t.textContent = r.done ? '+' + mmss(-left) : mmss(Math.ceil(left));
  const b = $('#rest-bar'); if (b) b.style.width = Math.min(100, 100 * (1 - (r.endsAt - Date.now()) / r.total)) + '%';
}
function tick() {
  const a = S.active; if (!a) return;
  const r = a.rest;
  if (r && !r.done && Date.now() >= r.endsAt) {
    r.done = true; saveActive();
    if (document.visibilityState === 'visible') beep();
    if (S.view === 'session') { render(); restEl.classList.add('flash'); }
    return;
  }
  tickText();
}
setInterval(tick, 250);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tick(); keepAwake(); if (S.view === 'session') render(); } });
window.addEventListener('pageshow', () => { tick(); });

      <div class="muted" style="font-size:12px;margin-top:4px">Paso de ${kg(ex.inc)} kg</div></div>
    <div><div class="eyebrow" style="margin-bottom:6px">Repeticiones al fallo</div>
      <div class="stepper"><button data-act="r" data-d="-1" aria-label="Menos repeticiones">−</button><input id="in-r" inputmode="numeric" autocomplete="off" value="${sh.r}" aria-label="Repeticiones"><button data-act="r" data-d="1" aria-label="Más repeticiones">+</button></div></div>
    ${isLast ? `<div><div class="eyebrow" style="margin-bottom:6px">¿Cuántas reps más podías sacar? (RIR)</div>
      <div class="rirs">${[0, 1, 2, 3, 4].map(n => `<button data-act="rir" data-n="${n}" aria-pressed="${sh.rir === n}">${n === 4 ? '4+' : n}</button>`).join('')}</div>
      ${sh.rir >= 2 ? `<div style="font-size:13px;margin-top:6px;color:var(--green)">RIR ≥ 2: la próxima sesión sube la carga.</div>` : ''}</div>` : ''}
    <button class="btn primary block" data-act="saveset" ${canSave ? '' : 'disabled'}>${sh.edit ? 'Guardar cambios' : 'Serie hecha · iniciar descanso'}</button>
  </div></div></div>`;
}
function parseNum(v) { v = String(v).replace(',', '.').trim(); if (v === '') return ''; const n = Number(v); return Number.isFinite(n) ? n : ''; }

/* ---------------- Acciones ---------------- */
function startSession(n) {
  unlockAudio();
  S.draft = {};
  S.active = { id: 's' + Date.now(), rv: ROUTINE, day: n, startedAt: Date.now(), updatedAt: Date.now(), phase: 'train', sets: {}, nextW: {}, rest: null, fatigue: {} };
  saveActive(); S.view = 'session'; render(); keepAwake(); app.scrollTo(0, 0);
}
function saveSet() {
  const sh = S.sheet, a = S.active, ex = EX[sh.exId];
  const set = { w: sh.w === '' ? 0 : sh.w, r: Math.max(0, Math.round(sh.r)) };
  if (sh.rir != null) set.rir = sh.rir;
  S.sheet = null;
  if (sh.edit) { const old = a.sets[ex.id][sh.idx]; a.sets[ex.id][sh.idx] = { ...old, ...set, t: old.t }; saveActive(); render(); return; }
  commitSet(ex, set);
}
/* Registra una serie en el historial de SU ejercicio y decide el descanso.
   Superserie: A_n no dispara descanso; recién A_n + B_n disparan el descanso enlazado. */
function commitSet(ex, set) {
  const a = S.active, d = DAY(a.day);
  set.t = Date.now();
  a.sets[ex.id] = a.sets[ex.id] || [];
  a.sets[ex.id].push(set);
  delete a.nextW[ex.id];
  delete S.draft[ex.id + ':' + (a.sets[ex.id].length - 1)];
  const e = e1rm(set.w, set.r, set.rir || 0);
  if (e > (S.profile.best[ex.id] || 0) && S.profile.best[ex.id]) toast(`Récord estimado: e1RM ${kg(Math.round(e * 10) / 10)} kg`);
  const ra = restAfter(d, ex, a.sets);
  if (ra.rest === 0 && ra.next) {
    a.rest = null; toast(`Sin descanso: seguí con ${exName(ra.next)}`);
  } else if (d.ex.every(x => logged(x.id).length >= x.sets)) {
    a.rest = null; toast('Última serie del día. Cerrá la sesión.');
  } else {
    const now = Date.now();
    const members = ex.g ? d.ex.filter(m => m.g === ex.g) : [ex];
    const suggs = members.map(m => {
      const l = logged(m.id), last = l[l.length - 1];
      if (!last || l.length >= m.sets) return null;
      const sg = suggestAfterSet(m, last);
      return sg.type === 'low' || sg.type === 'high' ? { exId: m.id, ...sg } : null;
    }).filter(Boolean);
    a.rest = { startedAt: now, endsAt: now + ra.rest * 1000, total: ra.rest * 1000, exId: ex.id, group: ex.g || null, suggs, applied: {}, done: false };
  }
  saveActive(); unlockAudio(); render();
}
function finishSave() {
  const a = S.active, d = DAY(a.day), P = S.profile, now = Date.now();
  const res = { day: a.day, minutes: Math.round((now - a.startedAt) / 60000), efficiency: Math.round(efficiency(d, a.sets, true).value * 10) / 10, next: [], swaps: [], watch: [], prs: [] };
  const exercises = [];
  let tonnage = 0;
  for (const ex of d.ex) {
    const l = logged(ex.id);
    const pr = nextPrescription(ex, l, P.prog[ex.id]);
    if (l.length) {
      P.prog[ex.id] = { w: pr.w, target: pr.target, status: pr.status, miss: pr.miss, reason: pr.reason };
      const f = a.fatigue[ex.id] || { c: 'v', j: [] };
      P.joint[ex.id] = [...(P.joint[ex.id] || []), f.c].slice(-3);
      const ja = jointAlert(P.joint[ex.id]);
      if (ja.swap && !P.swaps[ex.id]) res.swaps.push({ id: ex.id, name: exName(ex), alt: ex.alt });
      else if (ja.watch) res.watch.push(exName(ex));
      const best = Math.max(...l.map((s, i) => e1rm(s.w, s.r, i === l.length - 1 ? (s.rir || 0) : 0)));
      if (best > (P.best[ex.id] || 0)) { if (P.best[ex.id]) res.prs.push({ name: exName(ex), e: Math.round(best * 10) / 10 }); P.best[ex.id] = best; }
      tonnage += l.reduce((t, x) => t + x.w * x.r * (ex.per ? 2 : 1), 0);
      exercises.push({ id: ex.id, name: exName(ex), cat: ex.cat, ss: ex.g || null, sets: l, e1rm: Math.round(best * 10) / 10, light: f.c, joints: f.j });
      res.next.push({ name: exName(ex), w: pr.w, status: pr.status, reason: pr.reason });
    }
  }
  P.lastDay = a.day;
  const session = { id: a.id, day: a.day, startedAt: a.startedAt, endedAt: now, minutes: res.minutes, efficiency: res.efficiency, tonnage: Math.round(tonnage), exercises };
  S.sessions = [session, ...S.sessions.filter(s => s.id !== session.id)];
  saveProfile(); Store.addSession(session);
  S.active = null; Store.put('active', null); releaseAwake();
  S.result = res; S.view = 'result'; render(); app.scrollTo(0, 0);
}
async function doExport() {
  const data = JSON.stringify({ app: 'bitacora-onori', v: 1, exportedAt: new Date().toISOString(), profile: S.profile, sessions: S.sessions }, null, 1);
  const filename = 'bitacora-onori-' + new Date().toISOString().slice(0, 10) + '.json';
  if (Store.dl) { try { await Store.dl.save({ filename, data }); toast('Backup exportado'); } catch (e) { if (e && e.code !== 'declined') toast('No se pudo exportar el archivo.'); } return; }
  try { const u = URL.createObjectURL(new Blob([data], { type: 'application/json' })); const l = document.createElement('a'); l.href = u; l.download = filename; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); }
  catch (e) { toast('Este visor no permite descargar archivos.'); }
}
$('#importFile').addEventListener('change', ev => {
  const f = ev.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result);
      if (j.app !== 'bitacora-onori' || !j.profile || !Array.isArray(j.sessions)) throw 0;
      S.confirm = { title: 'Importar backup', body: `${j.sessions.length} sesiones. Reemplaza las cargas y prescripciones actuales; las sesiones se suman.`, ok: 'Importar', act: async () => {
        S.profile = j.profile; saveProfile();
        for (const s of j.sessions) await Store.addSession(s);
        S.sessions = await Store.listSessions(); toast('Backup importado'); render();
      } };
      renderSheet();
    } catch (e) { toast('El archivo no es un backup de la bitácora.'); }
    ev.target.value = '';
  };
  rd.readAsText(f);
});

document.addEventListener('input', ev => {
  const k = ev.target.dataset && ev.target.dataset.draft;
  if (k) { const v = parseNum(ev.target.value); S.draft[k] = S.draft[k] || { w: '', r: 0 }; S.draft[k][ev.target.dataset.f] = ev.target.dataset.f === 'r' ? (v === '' ? '' : v) : v; return; }
  if (!S.sheet) return;
  if (ev.target.id === 'in-w') { S.sheet.w = parseNum(ev.target.value); refreshSaveBtn(); }
  if (ev.target.id === 'in-r') { const n = parseNum(ev.target.value); S.sheet.r = n === '' ? 0 : n; refreshSaveBtn(); }
});
function refreshSaveBtn() {
  const sh = S.sheet, ex = EX[sh.exId], isLast = sh.idx === ex.sets - 1;
  const b = sheetEl.querySelector('[data-act="saveset"]'); if (b) b.disabled = !(sh.w !== '' && sh.w >= 0 && sh.r >= 0 && (!isLast || sh.rir != null));
}

/* Mantener apretado + o −: repite el paso (tras 400 ms, cada 110 ms). */
let holdT = null, holdI = null, holdUsed = false;
function stepSheet(kind, d) {
  if (!S.sheet) return;
  if (kind === 'w') { const ex = EX[S.sheet.exId]; const cur = S.sheet.w === '' ? 0 : S.sheet.w; S.sheet.w = Math.max(0, Math.round((cur + d * ex.inc) * 100) / 100); }
  else S.sheet.r = Math.max(0, (S.sheet.r || 0) + d);
  renderSheet();
}
function stopHold() { clearTimeout(holdT); clearInterval(holdI); holdT = holdI = null; }
document.addEventListener('pointerdown', ev => {
  const b = ev.target.closest('[data-act="w"],[data-act="r"]'); if (!b) return;
  const kind = b.dataset.act, d = +b.dataset.d; holdUsed = false; stopHold();
  holdT = setTimeout(() => { holdUsed = true; holdI = setInterval(() => stepSheet(kind, d), 110); }, 400);
});
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, stopHold));
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('scrim') && ev.target.closest('[data-stop]')) return;
  const act = el.dataset.act, a = S.active;
  switch (act) {
    case 'tab': S.view = el.dataset.v; render(); app.scrollTo(0, 0); break;
    case 'home': S.view = 'home'; S.result = null; render(); app.scrollTo(0, 0); break;
    case 'resume': S.view = 'session'; unlockAudio(); render(); keepAwake(); break;
    case 'start':
      if (a) { toast('Ya hay una sesión en curso.'); break; }
      startSession(+el.dataset.n); break;
    case 'log': {
      const ex = EX[el.dataset.ex], i = +el.dataset.i;
      if (setState(ex, i) !== 'ready') break;
      const p = prefill(ex, i);
      S.sheet = { exId: ex.id, idx: i, w: p.w, r: p.r, rir: null, edit: false }; renderSheet(); break; }
    case 'edit': {
      const ex = EX[el.dataset.ex], i = +el.dataset.i, s = logged(ex.id)[i];
      S.sheet = { exId: ex.id, idx: i, w: s.w, r: s.r, rir: s.rir != null ? s.rir : (i === ex.sets - 1 ? 0 : null), edit: true }; renderSheet(); break; }
    case 'w': case 'r': if (holdUsed) { holdUsed = false; break; } stepSheet(act, +el.dataset.d); break;
    case 'rir': S.sheet.rir = +el.dataset.n; renderSheet(); break;
    case 'saveset': saveSet(); break;
    case 'ssdone': {
      const ex = EX[el.dataset.ex], i = +el.dataset.i;
      if (setState(ex, i) !== 'ready') break;
      const dr = S.draft[ex.id + ':' + i] || prefill(ex, i);
      if (dr.w === '' || dr.r === '' || !(dr.r >= 0)) { toast('Completá la carga y las reps.'); break; }
      const set = { w: dr.w, r: Math.max(0, Math.round(dr.r)) };
      if (i === ex.sets - 1) { S.sheet = { exId: ex.id, idx: i, w: set.w, r: set.r, rir: null, rirOnly: true }; renderSheet(); break; }
      commitSet(ex, set); break; }
    case 'rirsave': { const sh = S.sheet; S.sheet = null; commitSet(EX[sh.exId], { w: sh.w, r: sh.r, rir: +el.dataset.n }); break; }
    case 'closesheet': S.sheet = null; renderSheet(); break;
    case 'add45': a.rest.endsAt += 45000; a.rest.total += 45000; a.rest.applied45 = true; saveActive(); renderRest(); break;
    case 'applyw': { const id = el.dataset.ex; a.nextW[id] = +el.dataset.w; a.rest.applied = a.rest.applied || {}; a.rest.applied[id] = +el.dataset.w;
      for (const k in S.draft) if (k.startsWith(id + ':')) delete S.draft[k];
      saveActive(); render(); break; }
    case 'restadj': { const d = +el.dataset.d * 1000; a.rest.endsAt = Math.max(Date.now(), a.rest.endsAt + d); a.rest.total = Math.max(1000, a.rest.total + d); saveActive(); tick(); tickText(); break; }
    case 'skip': a.rest.endsAt = Date.now(); a.rest.done = true; saveActive(); render(); break;
    case 'dismiss': a.rest = null; saveActive(); render(); break;
    case 'finish': a.phase = 'finish'; a.rest = null; saveActive(); render(); app.scrollTo(0, 0); break;
    case 'backtrain': a.phase = 'train'; saveActive(); render(); break;
    case 'light': { const f = a.fatigue[el.dataset.ex] = a.fatigue[el.dataset.ex] || { c: 'v', j: [] }; f.c = el.dataset.c; if (f.c === 'v') f.j = []; saveActive(); render(); break; }
    case 'joint': { const f = a.fatigue[el.dataset.ex]; const j = el.dataset.j; f.j = f.j.includes(j) ? f.j.filter(x => x !== j) : [...f.j, j]; saveActive(); render(); break; }
    case 'save': finishSave(); break;
    case 'discard': S.confirm = { title: 'Descartar sesión', body: 'Se borran las series de hoy. Las cargas de la próxima sesión no cambian.', ok: 'Descartar', act: () => { S.active = null; Store.put('active', null); releaseAwake(); S.view = 'home'; render(); } }; renderSheet(); break;
    case 'okc': { const c = S.confirm; S.confirm = null; renderSheet(); c && c.act(); break; }
    case 'cancelc': S.confirm = null; renderSheet(); break;
    case 'swap': { const ex = EX[el.dataset.ex]; S.profile.swaps[ex.id] = ex.alt; S.profile.prog[ex.id] = { w: null, status: 'new', reason: 'Variante nueva: buscá la carga de referencia.' }; S.profile.joint[ex.id] = []; saveProfile(); S.result.swaps = S.result.swaps.filter(s => s.id !== ex.id); toast('Variante aplicada desde la próxima sesión'); render(); break; }
    case 'unswap': { const ex = EX[el.dataset.ex]; delete S.profile.swaps[ex.id]; S.profile.prog[ex.id] = { w: null, status: 'new', reason: 'Volviste al ejercicio original.' }; saveProfile(); render(); break; }
    case 'tip': { const c = $('#cap-' + el.dataset.chart); if (c) c.textContent = el.dataset.tip; break; }
    case 'openh': S.openHist = S.openHist === el.dataset.id ? null : el.dataset.id; render(); break;
    case 'export': doExport(); break;
    case 'import': $('#importFile').click(); break;
  }
});

/* ---------------- Arranque ---------------- */
/* Una sesión activa de la rutina anterior no se retoma: sus ejercicios ya no existen. */
function freshActive(a) {
  if (!a || a.rv === ROUTINE) return a || null;
  if (Object.values(a.sets || {}).some(x => x.length)) toast('Se cerró una sesión de la rutina anterior sin guardar.');
  lsSet('active', null);
  return null;
}
(async function boot() {
  S.profile = lsGet('profile') || defaultProfile();
  S.active = freshActive(lsGet('active'));
  S.sessions = lsGet('sessions') || [];
  if (S.active) S.view = 'session';
  render();
  if (S.active) keepAwake();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if (await Store.connect()) {
    const [p, act, ss] = await Promise.all([Store.get('profile'), Store.get('active'), Store.listSessions()]);
    if (p) S.profile = p;
    S.active = freshActive(act); S.sessions = ss;
    if (act && !S.active) Store.put('active', null);
    if (S.active && S.view === 'home') S.view = 'session';
    if (!S.active && S.view === 'session') S.view = 'home';
    if (S.active) Store.put('active', S.active);
    render();
  }
})();
</script>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
